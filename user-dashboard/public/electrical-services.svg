<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Electrical Services Icon -->
  <rect width="200" height="200" fill="#fff3e0"/>
  <g transform="translate(35, 30)">
    <!-- Multimeter -->
    <rect x="0" y="0" width="35" height="50" fill="#ffde00" stroke="#ff6b00" stroke-width="2" rx="3"/>
    <circle cx="17.5" cy="25" r="12" fill="#333" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="15" x2="35" y2="15" stroke="#333" stroke-width="1"/>
    <!-- Socket -->
    <g transform="translate(50, 10)">
      <rect x="0" y="0" width="20" height="25" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="2"/>
      <circle cx="5" cy="8" r="2" fill="#666"/>
      <circle cx="15" cy="8" r="2" fill="#666"/>
      <rect x="2" y="15" width="16" height="3" fill="#666"/>
    </g>
    <!-- Screwdriver -->
    <g transform="translate(45, 45) rotate(-30)">
      <rect x="0" y="0" width="3" height="25" fill="#ffde00" stroke="#ff6b00" stroke-width="1"/>
      <polygon points="0,0 3,0 1.5,-5" fill="#ff6b00"/>
    </g>
    <!-- Wire/Cable -->
    <path d="M 70 45 Q 75 50 70 55" stroke="#ff0000" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
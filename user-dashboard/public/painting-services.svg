<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Painting Services Icon -->
  <rect width="200" height="200" fill="#fce4ec"/>
  <g transform="translate(30, 30)">
    <!-- Paint Can -->
    <rect x="10" y="20" width="25" height="30" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="1" rx="2"/>
    <rect x="10" y="18" width="25" height="3" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
    <ellipse cx="22.5" cy="50" rx="13" ry="3" fill="#0d2753"/>
    <!-- Paint label -->
    <rect x="12" y="28" width="21" height="12" fill="#87ceeb" opacity="0.8"/>
    <!-- Paintbrush -->
    <g transform="translate(50, 35)">
      <ellipse cx="0" cy="0" rx="4" ry="8" fill="#8b4513"/>
      <rect x="-1" y="8" width="2" height="15" fill="#d2b48c" stroke="#8b4513" stroke-width="1"/>
    </g>
    <!-- Paint Roller -->
    <g transform="translate(55, 60)">
      <rect x="0" y="0" width="15" height="4" fill="#ffffff" stroke="#333" stroke-width="1" rx="2"/>
      <line x1="17" y1="2" x2="22" y2="2" stroke="#333" stroke-width="2"/>
      <line x1="17" y1="2" x2="20" y2="8" stroke="#333" stroke-width="2"/>
    </g>
    <!-- Paint Swatches -->
    <rect x="10" y="58" width="6" height="6" fill="#ff6b6b"/>
    <rect x="18" y="58" width="6" height="6" fill="#4ecdc4"/>
    <rect x="26" y="58" width="6" height="6" fill="#ffe66d"/>
  </g>
</svg>